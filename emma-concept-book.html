<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Brand Voice Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --dark:#050E24;--dark-2:#091630;--navy:#073C8C;
  --orange:#FF6625;--yellow:#FFD551;--sky:#A4D3EB;
  --cream:#F4EDE0;--cream-2:#EBE0CA;--ink:#1a120a;--ink-mid:#6b5c45;
  --gold:#C9A227;
}
html,body{width:100%;height:100%;background:var(--dark);overflow:hidden;}
body{font-family:'Inter',sans-serif;}

/* SCENE */
.scene{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:2200px;position:relative;}
.scene-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 35% 50%,rgba(7,60,140,0.2) 0%,transparent 60%),radial-gradient(ellipse at 65% 50%,rgba(255,102,37,0.07) 0%,transparent 55%);}

/* BOOK */
.book-wrap{position:relative;width:min(860px,94vw);height:min(540px,56vh);transform-style:preserve-3d;}
.book-wrap::after{content:'';position:absolute;bottom:-20px;left:10%;right:10%;height:32px;background:radial-gradient(ellipse,rgba(0,0,0,0.6) 0%,transparent 70%);filter:blur(10px);}

/* SPINE */
.spine{position:absolute;left:50%;top:0;bottom:0;width:14px;transform:translateX(-50%);background:linear-gradient(to right,#7a5c10,#C9A227,#b8910f,#7a5c10);z-index:20;box-shadow:0 0 10px rgba(0,0,0,0.5);}

/* PAGE SHELLS — always visible, content swapped */
.page-l,.page-r{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;}
.page-l{left:0;border-radius:6px 0 0 6px;background:var(--cream);box-shadow:-2px 0 16px rgba(0,0,0,0.4),inset -6px 0 12px rgba(0,0,0,0.07);}
.page-r{right:0;border-radius:0 6px 6px 0;background:var(--cream);box-shadow:2px 0 16px rgba(0,0,0,0.4),inset 6px 0 12px rgba(0,0,0,0.07);}

/* Paper grain texture overlay */
.page-l::before,.page-r::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");opacity:0.5;pointer-events:none;z-index:1;}

/* FLIP PAGE */
.page-flip{position:absolute;top:0;bottom:0;right:0;width:50%;transform-origin:left center;transform-style:preserve-3d;transition:transform 0.72s cubic-bezier(0.645,0.045,0.355,1.000);z-index:10;cursor:pointer;}
.flip-front,.flip-back{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;}
.flip-front{background:var(--cream);border-radius:0 6px 6px 0;box-shadow:2px 0 16px rgba(0,0,0,0.4),inset 6px 0 12px rgba(0,0,0,0.07);}
.flip-back{background:var(--cream-2);border-radius:6px 0 0 6px;transform:rotateY(180deg);box-shadow:-2px 0 16px rgba(0,0,0,0.4),inset -6px 0 12px rgba(0,0,0,0.07);}
.page-flip.flipped{transform:rotateY(-180deg);}

/* PAGE CONTENT */
.pc{position:absolute;inset:0;padding:32px 32px 40px 36px;overflow:hidden;z-index:2;}
.pc.dark-cover{padding:0;}
.pc.dark-back{padding:0;}
.ch{font-size:9px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--orange);margin-bottom:14px;font-family:'Inter',sans-serif;}
h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:clamp(18px,2.8vw,28px);color:var(--ink);line-height:1.18;margin-bottom:14px;}
.rule{width:36px;height:1px;background:var(--orange);margin:12px 0;}
.bd{font-size:12px;line-height:1.7;color:var(--ink-mid);margin-bottom:10px;}
.bd strong{color:var(--ink);font-weight:600;}
.bd em{font-style:italic;font-family:'Cormorant Garamond',serif;font-size:1.1em;}
.pq{border-left:2px solid var(--orange);padding:8px 0 8px 12px;margin:12px 0;}
.pq p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:var(--ink);line-height:1.4;}
.pn{position:absolute;bottom:14px;font-size:10px;color:var(--ink-mid);font-family:'Cormorant Garamond',serif;font-style:italic;}
.pn.left{left:36px;}
.pn.right{right:36px;}
.sb{display:flex;gap:6px;margin:10px 0;}
.st{flex:1;background:var(--dark);border-radius:3px;padding:8px 4px;text-align:center;}
.sn{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:var(--yellow);line-height:1;}
.sl{display:block;font-size:8px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(164,211,235,0.6);}
.otag{display:inline-block;background:var(--dark);border:1px solid rgba(255,102,37,0.3);border-radius:2px;padding:2px 8px;font-size:9px;letter-spacing:0.08em;color:var(--orange);font-family:'Inter',sans-serif;margin-bottom:4px;}
.il{list-style:none;font-size:11px;color:var(--ink-mid);line-height:1.65;}
.il li::before{content:'— ';}

/* CONTROLS */
.controls{display:flex;align-items:center;gap:24px;margin-top:22px;position:relative;z-index:30;}
.cb{width:42px;height:42px;border-radius:50%;border:1px solid rgba(164,211,235,0.2);background:rgba(9,22,48,0.8);color:var(--sky);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.cb:hover{border-color:var(--orange);color:var(--orange);}
.cb:disabled{opacity:0.2;cursor:default;}
.ind{font-size:11px;letter-spacing:0.08em;color:rgba(164,211,235,0.4);font-family:'Cormorant Garamond',serif;font-style:italic;min-width:90px;text-align:center;}
.hint{position:absolute;bottom:14px;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(164,211,235,0.25);text-align:center;width:100%;}
</style>
</head>

<style id="emma-nav-css">
:root { --emma-nav-h: 60px; }
.emma-nav, .emma-nav *, .emma-nav *::before, .emma-nav *::after { box-sizing: border-box; }
.emma-nav { position: sticky; top: 0; z-index: 9999; background: rgba(5,14,36,0.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(164,211,235,0.14); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
.emma-nav-inner { max-width: 1040px; margin: 0 auto; padding: 0 24px; height: var(--emma-nav-h); display: flex; align-items: center; gap: 16px; }
.en-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; flex-shrink: 0; }
.en-brand img { height: 24px; width: auto; display: block; filter: none; opacity: 1; }
.en-brand span { font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(164,211,235,0.65); }
.en-links { display: flex; align-items: center; gap: 2px; margin-left: auto; }
.en-link { position: relative; display: inline-flex; align-items: center; gap: 7px; font-family: inherit; font-size: 12.5px; font-weight: 500; color: rgba(243,245,253,0.78); text-decoration: none; background: none; border: 0; cursor: pointer; padding: 8px 14px; border-radius: 100px; white-space: nowrap; transition: color .18s, background .18s; }
.en-link:hover { color: #FFFFFF; background: rgba(164,211,235,0.10); }
.en-link.active { color: #FFD551; }
.en-drop { position: relative; }
.en-caret { width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform .2s; }
.en-drop.open .en-caret { transform: translateY(1px) rotate(-135deg); }
.en-drop-menu { position: absolute; top: calc(100% + 8px); right: 0; min-width: 280px; background: #091630; border: 1px solid rgba(164,211,235,0.16); border-radius: 12px; padding: 6px; box-shadow: 0 22px 46px rgba(0,0,0,0.5); opacity: 0; visibility: hidden; transform: translateY(-6px); transition: opacity .18s, transform .18s, visibility .18s; }
.en-drop.open .en-drop-menu { opacity: 1; visibility: visible; transform: none; }
.en-drop-menu a { display: block; padding: 10px 14px; border-radius: 8px; text-decoration: none; transition: background .15s; }
.en-drop-menu a:hover { background: rgba(164,211,235,0.09); }
.en-dl { display: block; font-size: 13px; font-weight: 600; color: #F3F5FD; margin-bottom: 2px; }
.en-ds { display: block; font-size: 11px; color: rgba(164,211,235,0.58); }
.en-toggle { display: none; margin-left: auto; width: 38px; height: 38px; align-items: center; justify-content: center; flex-direction: column; gap: 4px; background: none; border: 0; cursor: pointer; }
.en-toggle span { display: block; width: 18px; height: 1.5px; background: #F3F5FD; transition: transform .2s, opacity .2s; }
.emma-nav.open .en-toggle span:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
.emma-nav.open .en-toggle span:nth-child(2) { opacity: 0; }
.emma-nav.open .en-toggle span:nth-child(3) { transform: translateY(-5.5px) rotate(-45deg); }
@media (hover: hover) and (min-width: 861px) {
  .en-drop:hover .en-drop-menu { opacity: 1; visibility: visible; transform: none; }
  .en-drop:hover .en-caret { transform: translateY(1px) rotate(-135deg); }
}
@media (max-width: 860px) {
  :root { --emma-nav-h: 56px; }
  .emma-nav-inner { padding: 0 18px; }
  .en-toggle { display: flex; }
  .en-links { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: stretch; gap: 2px; margin-left: 0; background: #050E24; border-bottom: 1px solid rgba(164,211,235,0.14); padding: 10px 14px 16px; }
  .emma-nav.open .en-links { display: flex; }
  .en-link { padding: 11px 12px; font-size: 14px; border-radius: 8px; justify-content: space-between; }
  .en-drop-menu { position: static; display: none; opacity: 1; visibility: visible; transform: none; min-width: 0; box-shadow: none; background: rgba(164,211,235,0.05); border-color: rgba(164,211,235,0.10); margin: 2px 0 6px; }
  .en-drop.open .en-drop-menu { display: block; }
}
.scene { height: calc(100vh - var(--emma-nav-h)); }

solute;top:28px;right:28px;height:24px;opacity:0.75;\">\n      <div style=\"position:absolute;bottom:0;left:0;right:0;padding:36px 40px;\">\n        <p style=\"font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:#FF6625;margin-bottom:12px;font-family:Inter,sans-serif;font-weight:600;\">An editorial experience</p>\n        <h1 style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:clamp(24px,4vw,40px);color:#fff;line-height:1.1;margin-bottom:14px;\">The Brand<br>Voice<br>Experience</h1>\n        <p style=\"font-size:11px;letter-spacing:0.06em;color:rgba(164,211,235,0.6);font-family:Inter,sans-serif;\">Emma Gibbs-Ng \u00d7 Allegro Captures</p>\n      </div>\n    ", "right": "\n      <p class=\"ch\">Begin here</p>\n      <h2>When did you last say something and think \u2014 yes, that's exactly it?</h2>\n      <div class=\"rule\"></div>\n      <p class=\"bd\">Most people have incredible branding. A logo they love, colours that feel right, a website that looks the part. And yet \u2014 online, they still don't sound quite like themselves.</p>\n      <p class=\"bd\">This is about fixing that. Not with more content. With <em>the right voice</em>.</p>\n      <div class=\"pq\"><p>Click the arrow to turn the page.</p></div>\n      <p class=\"pn right\">Turn \u2192</p>\n    ", "leftClass": "", "rightClass": ""}, {"left": "\n      <p class=\"ch\">The missing piece</p>\n      <h2>Your voice has been shaped by every template you've ever followed.</h2>\n      <div class=\"rule\"></div>\n      <p class=\"bd\">Hooks. Frameworks. Content pillars. They're useful until they're not \u2014 until you find yourself posting things that technically say the right things but don't feel like you said them.</p>\n      <div class=\"pq\"><p>\"She'd tweaked it so much for the algorithm that she'd lost her essence entirely.\"</p></div>\n      <p class=\"bd\">The Brand Voice Experience gives you a space where the camera is running, Emma is asking questions, and you're free to stop performing and start talking.</p>\n      <p class=\"pn left\">2</p>\n    ", "right": "\n      <p class=\"ch\">What this actually is</p>\n      <h2>An editorial session, not a content shoot.</h2>\n      <div class=\"rule\"></div>\n      <p class=\"bd\">Think of it like a high-end magazine interview \u2014 except you keep everything. The conversation is real, the environment is designed to make you feel at ease, and the result is a bank of assets that could only have come from you.</p>\n      <p class=\"bd\"><strong>Emma leads the conversation.</strong> She's spent years drawing out what people mean \u2014 not what they think they should say.</p>\n      <p class=\"bd\"><strong>Allegro Captures holds the camera.</strong> Nina timestamps the moments that land. Dom captures every angle. The edit finds what the day uncovered.</p>\n      <p class=\"pn right\">3</p>\n    ", "leftClass": "", "rightClass": ""}, {"left": "\n      <p class=\"ch\">Before the day</p>\n      <h2>You don't arrive cold.</h2>\n      <div class=\"rule\"></div>\n      <p class=\"bd\">Emma spends time with you ahead of the shoot \u2014 understanding the territories you want to explore, the stories that keep coming up, the things you've been trying to say for months.</p>\n      <p class=\"bd\">A short brief goes to Allegro Captures so the edit is intentional, not a guess.</p>\n      <div class=\"pq\"><p>\"I always knew what I wanted to say. I just needed someone to ask the right questions.\"</p></div>\n      <p class=\"pn left\">4</p>\n    ", "right": "\n      <p class=\"ch\">On the day</p>\n      <h2>The conversation is the shoot.</h2>\n      <div class=\"rule\"></div>\n      <p class=\"bd\">Nina and Dom are already set up when you arrive. The first thirty minutes aren't recorded \u2014 they're spent making the room feel safe.</p>\n      <p class=\"bd\">Then Emma starts asking. Up to 2 cameras running. No scripts, no re-takes, no right answers. <strong>Just a conversation that happens to be captured.</strong></p>\n      <p class=\"bd\">Nina timestamps anything remarkable. Dom captures every angle. The moments where you hit something real \u2014 those become your assets.</p>\n      <p class=\"pn right\">5</p>\n    ", "leftClass": "", "rightClass": ""}, {"left": "\n      <p class=\"ch\">The packages</p>\n      <h2>Half Day</h2>\n      <div class=\"rule\"></div>\n      <div class=\"sb\">\n        <div class=\"st\"><span class=\"sn\">3h</span><span class=\"sl\">Shoot</span></div>\n        <div class=\"st\"><span class=\"sn\">18</span><span class=\"sl\">Assets</span></div>\n        <div class=\"st\"><span class=\"sn\">3mo</span><span class=\"sl\">Content</span></div>\n      </div>\n      <p class=\"otag\">Option A \u2014 Standard</p>\n      <ul class=\"il\"><li>Up to 2-camera set-up</li><li>18 edited assets with captions</li><li>1 to 2 per week across 3 months</li><li>Travel up to 60 mins included</li></ul>\n      <p class=\"otag\" style=\"margin-top:8px;\">Option B \u2014 With Promo Clips</p>\n      <ul class=\"il\"><li>6 promo-style assets with b-roll</li><li>Planning session + briefing call</li></ul>\n      <p class=\"pn left\">6</p>\n    ", "right": "\n      <p class=\"ch\">The packages</p>\n      <h2>Full Day</h2>\n      <div class=\"rule\"></div>\n      <div class=\"sb\">\n        <div class=\"st\"><span class=\"sn\">6h</span><span class=\"sl\">Shoot</span></div>\n        <div class=\"st\"><span class=\"sn\">36</span><span class=\"sl\">Assets</span></div>\n        <div class=\"st\"><span class=\"sn\">3mo</span><span class=\"sl\">Content</span></div>\n      </div>\n      <p class=\"otag\">Option A \u2014 Standard</p>\n      <ul class=\"il\"><li>Up to 2-camera set-up</li><li>36 edited assets with captions</li><li>3 per week across 3 months</li><li>Travel up to 60 mins included</li></ul>\n      <p class=\"otag\" style=\"margin-top:8px;\">Option B \u2014 With Promo Clips</p>\n      <ul class=\"il\"><li>12 promo-style assets with b-roll</li><li>Planning session + briefing call</li></ul>\n      <p style=\"font-size:11px;color:#7a6a55;font-style:italic;margin-top:8px;\">Two clients back to back? Ask about the shared-day rate.</p>\n      <p class=\"pn right\">7</p>\n    ", "leftClass": "", "rightClass": ""}, {"left": "\n      <p class=\"ch\">After the day</p>\n      <h2>A quarter of assets. Ready before you leave.</h2>\n      <div class=\"rule\"></div>\n      <p class=\"bd\">Dom goes through the full session, finds the moments where you were most yourself, and cuts them into assets that are ready to use. Professionally edited. Captioned. Delivered.</p>\n      <div class=\"pq\"><p>\"I hadn't realised how inconsistent I'd been until I had a quarter's worth of content that all sounded like me.\"</p></div>\n      <p class=\"pn left\">8</p>\n    ", "right": "\n      <p class=\"ch\">The ongoing structure</p>\n      <h2>Your voice evolves. The shoots should too.</h2>\n      <div class=\"rule\"></div>\n      <p class=\"bd\">One shoot day works. But the most powerful version of this is when it becomes a rhythm \u2014 a quarterly shoot with us, with Emma's support in between.</p>\n      <p class=\"bd\">Your voice isn't static. Each time you come back, what comes out is <strong>sharper, clearer, more you.</strong></p>\n      <p class=\"bd\">A natural structure: quarterly shoot day, monthly 1-2-1s with Emma in between, content aligned to what you're selling season by season.</p>\n      <p class=\"pn right\">9</p>\n    ", "leftClass": "", "rightClass": ""}, {"left": "\n      <p class=\"ch\">Ready?</p>\n      <h2>This isn't a content shoot.<br>It's an editorial experience.</h2>\n      <div class=\"rule\"></div>\n      <p class=\"bd\">Get in touch and we'll work out together whether this is the right moment \u2014 and which package fits where you are.</p>\n      <p class=\"bd\">We can also help with the messaging and positioning of the offer itself \u2014 how to describe what your client walks away with, and how to make the case that this is what actually helps them stand out and show up consistently.</p>\n      <p class=\"pn left\">10</p>\n    ", "right": "\n      <div style=\"height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--dark);padding:36px;\">\n        <img src=\"https://assets.cdn.filesafe.space/NvBUrRGpp4lw06SebMtO/media/6a560e511097b81195ac1199.png\" style=\"height:32px;margin-bottom:24px;\">\n        <p style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;color:#A4D3EB;line-height:1.4;margin-bottom:28px;\">\"Ready to say the thing you've been meaning to say?\"</p>\n        <button onclick=\"void(0)\" style=\"background:#FF6625;color:#fff;border:none;font-family:Inter,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;padding:14px 28px;border-radius:2px;cursor:pointer;\">Start the conversation</button>\n        <p style=\"margin-top:20px;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(164,211,235,0.4);font-family:Inter,sans-serif;\">Strategy first. Camera second.</p>\n      </div>\n    ", "leftClass": "", "rightClass": ""}];
const labels = ['Cover','2–3','4–5','6–7','8–9','Fin'];
let cur = 0, anim = false;

function html2el(html, extra='') {
  // extra classes on .pc
  const d = document.createElement('div');
  d.className = 'pc' + (extra ? ' '+extra : '');
  d.innerHTML = html;
  return d;
}

function renderSpread(idx) {
  const s = spreads[idx];
  // Left page
  const pl = document.getElementById('pc-l');
  pl.className = 'pc' + (s.leftClass||'');
  pl.innerHTML = s.left;
  // Right (static) page
  const pr = document.getElementById('pc-r');
  pr.className = 'pc' + (s.rightClass||'');
  pr.innerHTML = s.right;
  // Flip front mirrors the right
  const pff = document.getElementById('pc-flip-front');
  pff.className = 'pc' + (s.rightClass||'');
  pff.innerHTML = s.right;
  // Flip back mirrors NEXT left (or empty)
  const pfb = document.getElementById('pc-flip-back');
  const next = spreads[idx+1];
  pfb.className = 'pc' + (next ? (next.leftClass||'') : '');
  pfb.innerHTML = next ? next.left : '';
}

function setUI() {
  document.getElementById('bn-prev').disabled = cur===0;
  document.getElementById('bn-next').disabled = cur===spreads.length-1;
  document.getElementById('ind').textContent = labels[cur]||String(cur+1);
}

function turn(dir) {
  if (anim) return;
  const next = cur+dir;
  if (next<0||next>=spreads.length) return;
  anim = true;
  const flip = document.getElementById('pg-flip');

  if (dir===1) {
    // Populate flip front with current right content before animating
    renderSpread(cur);
    flip.classList.remove('flipped');
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        flip.classList.add('flipped');
      });
    });
  } else {
    // Flipping back: populate back with current left
    const pfb = document.getElementById('pc-flip-back');
    const s = spreads[cur];
    pfb.className = 'pc'+(s.leftClass||'');
    pfb.innerHTML = s.left;
    flip.classList.add('flipped');
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        flip.classList.remove('flipped');
      });
    });
  }

  setTimeout(()=>{
    cur = next;
    renderSpread(cur);
    flip.classList.remove('flipped');
    setUI();
    anim = false;
  }, 400);
}

document.addEventListener('keydown', e=>{
  if (e.key==='ArrowRight'||e.key==='ArrowDown') turn(1);
  if (e.key==='ArrowLeft'||e.key==='ArrowUp') turn(-1);
});

// Init
renderSpread(0);
setUI();
</script>

<script id="emma-nav-js">
(function () {
  var bar = document.querySelector('.emma-nav');
  if (!bar) return;
  var toggle = bar.querySelector('.en-toggle');
  if (toggle) {
    toggle.addEventListener('click', function () {
      var open = bar.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }
  Array.prototype.forEach.call(bar.querySelectorAll('.en-drop-btn'), function (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var drop = btn.parentNode;
      var open = drop.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  });
  document.addEventListener('click', function (e) {
    if (bar.contains(e.target)) return;
    bar.classList.remove('open');
    if (toggle) toggle.setAttribute('aria-expanded', 'false');
    Array.prototype.forEach.call(bar.querySelectorAll('.en-drop.open'), function (d) {
      d.classList.remove('open');
      var b = d.querySelector('.en-drop-btn');
      if (b) b.setAttribute('aria-expanded', 'false');
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    bar.classList.remove('open');
    Array.prototype.forEach.call(bar.querySelectorAll('.en-drop.open'), function (d) { d.classList.remove('open'); });
  });
})();
</script>
